<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeetMind · 会议行动助手</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/"><span class="brand-icon">M</span><span>MeetMind<small>会议行动助手</small></span></a><button id="new-meeting">＋ 导入会议</button><div class="section-label">我的会议 <span id="meeting-count"></span></div><nav id="meetings" aria-label="会议记录"></nav><footer><button class="quiet" id="open-settings">连接与配置</button><div class="workspace-status"><span class="dot" aria-hidden="true"></span>本地工作空间</div></footer></aside>
<main><header><span>工作空间 <span class="slash">/</span> 会议报告</span><span id="mode" class="badge">本地模式</span></header><div id="notice" role="status" hidden></div><section id="content"></section></main>
<dialog id="import-dialog" aria-labelledby="import-title"><div class="modal-heading"><div><h2 id="import-title">导入会议</h2></div><button class="icon-button" id="cancel-import" aria-label="关闭导入">×</button></div><div class="import-tabs" role="tablist" aria-label="导入方式"><button type="button" id="tab-tencent" role="tab" aria-selected="true" aria-controls="tencent-panel">腾讯会议</button><button type="button" id="tab-manual" role="tab" aria-selected="false" aria-controls="manual-panel" tabindex="-1">手动导入</button></div><section id="tencent-panel" role="tabpanel" aria-labelledby="tab-tencent"><p class="muted">选择时间范围，找到需要整理的会议。</p><form id="import-form"><label for="time-range">时间范围</label><div class="range-row"><select id="time-range"><option value="1">最近 1 天</option><option value="3" selected>最近 3 天</option><option value="7">最近 7 天</option></select><button id="find-meetings" type="submit">导入</button></div></form><div id="import-status" role="status" aria-live="polite"></div><div id="remote-meetings" class="remote-meetings"></div><div id="meeting-preview" hidden><div class="readonly-meta"><label>会议主题<input id="preview-title" readonly></label><label>会议时间<input id="preview-date" readonly></label></div><p class="muted" id="import-disclosure"></p><div class="dialog-actions"><button id="confirm-import">导入并分析 →</button></div></div></section><section id="manual-panel" role="tabpanel" aria-labelledby="tab-manual" hidden><p class="muted">粘贴原始转写，或上传 TXT / JSON 文件。</p><form id="manual-form"><div class="fields"><label>会议主题<input name="title" required maxlength="200" placeholder="例如：产品项目周会"></label><label>会议日期<input name="date" type="date" required></label></div><label>转写内容<textarea name="transcript" rows="7" required placeholder="[00:15] 小林：我负责提交接口文档。"></textarea></label><p class="muted">支持逐行文本和标准段落 JSON；缺少的时间或发言人会标记为未知。</p><label>上传转写文件（最大 2 MB）<input id="manual-file" type="file" accept=".txt,.json,text/plain,application/json"></label><p id="manual-status" class="muted" role="status" aria-live="polite"></p><div class="dialog-actions"><button type="button" class="quiet" id="manual-sample">填入示例</button><button type="submit" id="manual-submit">导入会议</button></div></form></section></dialog>
<dialog id="settings" aria-labelledby="settings-title"><div class="modal-heading"><div><h2 id="settings-title">连接与配置</h2></div><button id="close-settings" class="icon-button" aria-label="关闭配置">×</button></div><div id="connections"></div><p class="muted">连接信息在项目本地 .env 中管理，修改后重启服务生效。凭据不会显示在网页中。</p><div class="settings-note"><strong>数据使用说明</strong><p>分析会将完整转写发送至已配置的模型服务。启用 LangSmith 后，追踪数据也会发送至该服务。滴答清单只在你逐项确认并点击同步后写入。</p></div></dialog>
</body></html>
